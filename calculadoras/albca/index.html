<!-- calculadoras/albca/index.html -->

<div class="calc-albca">
  <h2>Correção de Cálcio sérico pela Albumina</h2>

  <p class="calc-resumo">
    Corrige os níveis de cálcio sérico com base na concentração de albumina para
    avaliar o real valor do eletrólito.
  </p>

  <!-- Cálcio -->
  <div class="calc-campo">
    <label>Cálcio Sérico &mdash; mg/dL</label>
    <input
      type="number"
      id="albca-ca"
      inputmode="decimal"
      placeholder="Ex: 9"
      min="0"
    />
  </div>

  <!-- Albumina -->
  <div class="calc-campo">
    <label>Albumina Sérica &mdash; g/dL</label>
    <input
      type="number"
      id="albca-alb"
      inputmode="decimal"
      placeholder="Ex: 4"
      min="0"
    />
  </div>

  <!-- Valor normal Albumina-->
  <div class="calc-campo">
    <label>Valor de referência para Albumina Sérica &mdash; g/dL</label>
    <input
      type="number"
      id="albca-ref"
      inputmode="decimal"
      placeholder="Ex: 4"
      min="0"
    />
  </div>

  <button id="albca-btn-calcular" class="calc-btn">Calcular</button>

  <div id="albca-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="albca-valor"></p>
    <p class="calc-resultado-tag" id="albca-tag"></p>
    <p class="calc-resultado-interpretacao" id="albca-interpretacao"></p>
  </div>

  <p id="albca-erro" class="calc-erro escondido">
    Preencha todos os campos com valores numéricos válidos.
  </p>

  <div id="albca-accordion-container"></div>
</div>

<style>
  .info-formula-label-1 {
    margin: 24px 0 8px;
    color: var(--cor-texto-mudo);
    font-size: 0.8rem;
  }

  .calc-albca {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-albca h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid transparent;
  }

  .calc-resultado-valor {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .calc-resultado-interpretacao {
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .calc-resultado.adequada {
    background-color: rgba(22, 163, 74, 0.08);
    border-color: #16a34a;
  }
  .calc-resultado.adequada .calc-resultado-valor,
  .calc-resultado.adequada .calc-resultado-tag {
    color: #16a34a;
  }

  .calc-resultado.risco-baixo {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-baixo .calc-resultado-valor,
  .calc-resultado.risco-baixo .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.atencao {
    background-color: rgba(217, 158, 10, 0.1);
    border-color: #d99e0a;
  }
  .calc-resultado.atencao .calc-resultado-valor,
  .calc-resultado.atencao .calc-resultado-tag {
    color: #a16207;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }
</style>

<script>
  (function () {
    const inputCa = document.getElementById("albca-ca");
    const inputAlb = document.getElementById("albca-alb");
    const inputRef = document.getElementById("albca-ref");
    const btnCalcular = document.getElementById("albca-btn-calcular");
    const resultadoEl = document.getElementById("albca-resultado");
    const valorEl = document.getElementById("albca-valor");
    const tagEl = document.getElementById("albca-tag");
    const interpretacaoEl = document.getElementById("albca-interpretacao");
    const erroEl = document.getElementById("albca-erro");

    const container = document.getElementById("albca-accordion-container");

    var refs = `
  <ol class="info-list">
    <li>Payne RB, et al. Interpretation of Serum Calcium in Patients with Abnormal Serum Proteins.
      <a href="https://doi.org/10.1136/bmj.4.5893.643" target="_blank">Br Med J., 1973.</a>
    </li>
    <li>Parent X, et al. "Corrected" calcium: calcium status underestimation in non-hypoalbuminemic patients and in hypercalcemic patients.
      <a href="https://doi.org/10.1684/abc.2009.0348" target="_blank">Ann Biol Clin (Paris), 2009.</a>
    </li>
  </ol>`;

    var formula = `
  <p class="info-formula-label">Fórmula:</p>
  <div class="info-formula-block">
    \\( \\text{Ca}_{\\text{Corrigido}} = [0.8 \\times (\\text{Alb}_{\\text{Normal}} - \\text{Alb}_{\\text{Paciente}})] + \\text{Ca}_{\\text{Paciente}} \\)
  </div>
  <p class="info-formula-nota">
    Sua validade isolada é limitada &mdash; Sempre utilize em conjunto com o quadro clínico e demais avaliações laboratoriais.
  </p>`;

    var cuidados = `
  <ul class="info-list">
    <p class="info-formula-label">Etiologias comuns de Hipocalcemia:</p>
    <li>Insuficiência ou resistência à vitamina D;</li>
<li>Hipoparatireoidismo;</li>
<li>Doença renal ou doença hepática em estágio avançado, causando insuficiência de vitamina D;</li>
<li>Má absorção (malabsorção);</li>
<li>Após cirurgia de bypass gástrico;</li>
<li>Uso de medicamentos e ingestão de substâncias tóxicas;</li>
<li>Hipomagnesemia.</li>

    <p class="info-formula-label-1">Etiologias comuns de Hipercalcemia:</p>
    <li>Hiperparatireoidismo primário;</li>
<li>Toxicidade por vitamina D;</li>
<li>Toxicidade por vitamina A;</li>
<li>Câncer;</li>
<li>Sarcoidose;</li>
<li>Medicamentos (e.g. lítio e diuréticos tiazídicos);</li>
<li>Desidratação ou redução do volume de líquidos;</li>
<li>Condições genéticas (e.g. hipercalcemia hipocalciúrica familiar);</li>
<li>Pouco ou nenhum movimento.</li>

  </ul>`;

    container.innerHTML = montarAccordion(refs, formula, cuidados);
    iniciarAccordion();

    container.innerHTML = montarAccordion(refs, formula, cuidados);
    iniciarAccordion();
    renderMathInElement(container, {
      // linha nova
      delimiters: [{ left: "\\(", right: "\\)", display: false }],
    });

    function classificarAlbca(albca) {
      if (albca < 8.5)
        return {
          classe: "risco-baixo",
          tag: "Hipocalcemia",
          texto:
            "Avaliar preenchimento adequado dos campos, além de correlacionar com a clínica. Considerar intervenções e solicitação de demais exames, conforme necessário.",
        };
      if (albca > 10.5)
        return {
          classe: "risco-alto",
          tag: "Hipercalcemia",
          texto:
            "Avaliar preenchimento adequado dos campos, além de correlacionar com a clínica. Considerar intervenções e solicitação de demais exames, conforme necessário.",
        };
      return {
        classe: "adequada",
        tag: "Normocalcemia",
        texto:
          "Correlacionar com a clínica, reavaliando conforme necessário. Averiguar demais exames complementares.",
      };
    }

    function calcularAlbca() {
      const ca = parseFloat(inputCa.value);
      const alb = parseFloat(inputAlb.value);
      const ref = parseFloat(inputRef.value);

      if (
        isNaN(ca) ||
        isNaN(alb) ||
        isNaN(ref) ||
        ca < 0 ||
        alb < 0 ||
        ref < 0
      ) {
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      erroEl.classList.add("escondido");

      // Ca em mg/dL
      const albca = (ref - alb) * 0.8 + ca;
      const albcaArredondada = Math.round(albca * 10) / 10;

      const classificacao = classificarAlbca(albcaArredondada);

      valorEl.textContent = `Cálcio Corrigido: ${albcaArredondada} mg/dL`;
      tagEl.textContent = classificacao.tag;
      interpretacaoEl.textContent = classificacao.texto;

      resultadoEl.className = "calc-resultado " + classificacao.classe;
      resultadoEl.classList.remove("escondido");
      resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    btnCalcular.addEventListener("click", calcularAlbca);

    [inputCa, inputAlb, inputRef].forEach((campo) => {
      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calcularAlbca();
      });
    });
  })();
</script>
