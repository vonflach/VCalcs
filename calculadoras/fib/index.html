<!-- calculadoras/fib/index.html -->

<div class="calc-fib">
  <h2>Índice de Fibrose Hepática (FIB-4)</h2>

  <p class="calc-resumo">
    Estima a probabilidade de fibrose hepática pelo método FIB-4.
  </p>

  <!-- Idade -->
  <div class="calc-campo">
    <label>Idade (anos)</label>
    <input type="number" id="fib-idade" inputmode="decimal" placeholder="Ex: 50" min="0">
  </div>

  <!-- AST -->
  <div class="calc-campo">
    <label>AST (U/L)</label>
    <input type="number" id="fib-ast" inputmode="decimal" placeholder="Ex: 30" min="0">
  </div>

  <!-- ALT -->
  <div class="calc-campo">
    <label>ALT (U/L)</label>
    <input type="number" id="fib-alt" inputmode="decimal" placeholder="Ex: 40" min="0">
  </div>

  <!-- Plaquetas -->
  <div class="calc-campo">
    <label>Plaquetas (x 10⁹/L)</label>
    <input type="number" id="fib-plaquetas" inputmode="decimal" placeholder="Ex: 200" min="0">
  </div>
  
  <button id="fib-btn-calcular" class="calc-btn">Calcular</button>

  <div id="fib-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="fib-valor"></p>
    <p class="calc-resultado-tag" id="fib-tag"></p>
    <p class="calc-resultado-interpretacao" id="fib-interpretacao"></p>
  </div>

  <p id="fib-erro" class="calc-erro escondido">
    Preencha todos os campos com valores numéricos válidos.
  </p>
</div>

<style>
  .calc-fib {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-fib h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid var(--cor-cyan);
    background-color: rgba(14, 116, 144, 0.06);
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--cor-cyan);
    margin-bottom: 4px;
  }

.calc-resultado-valor {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--cor-cyan);
    margin: 0 0 8px;
    white-space: pre-line;
  }

.calc-resultado-interpretacao {
    font-size: 0.88rem;
    color: var(--cor-texto-secundario);
    line-height: 1.5;
    margin: 0;
  }
</style>

<script>
(function () {
  const inputIdades     = document.getElementById("fib-idade");
  const inputAlt        = document.getElementById("fib-alt");
  const inputAst        = document.getElementById("fib-ast");
  const inputPlaquetas  = document.getElementById("fib-plaquetas");
  const btnCalcular     = document.getElementById("fib-btn-calcular");
  const resultadoEl     = document.getElementById("fib-resultado");
  const valorEl         = document.getElementById("fib-valor");
  const tagEl           = document.getElementById("fib-tag");
  const interpretacaoEl = document.getElementById("fib-interpretacao");
  const erroEl          = document.getElementById("fib-erro");

  function classificarFib(fib) {
    if (fib < 1.3) {
    return {
        classe: "risco-baixo",
        tag: "Risco Baixo de Fibrose Hepática avançada",
        texto: "Individualizar cada caso. Avaliar necessidade de demais exames complementares e/ou encaminhamento para o atenção especializada conforme necessário."
    };
    }
    if (fib >= 2.67) {
    return {
        classe: "risco-alto",
        tag: "Risco Alto de Fibrose Hepática avançada",
        texto: "Individualizar cada caso. Avaliar necessidade de demais exames complementares e/ou encaminhamento para o atenção especializada conforme necessário."
    };
    }
    return {
    classe: "risco-intermediario",
    tag: "Risco Intermediário de Fibrose Hepática avançada",
    texto: "Individualizar cada caso. Avaliar necessidade de demais exames complementares e/ou encaminhamento para o atenção especializada conforme necessário."
    };
  }

  // Chama na inicialização para já mostrar a correta  
  function calcularFib() {
    const idade     = parseFloat(inputIdades.value);
    const ast       = parseFloat(inputAst.value);
    const alt       = parseFloat(inputAlt.value);
    const plaquetas = parseFloat(inputPlaquetas.value);

    if (isNaN(idade) || isNaN(ast) || isNaN(alt) || isNaN(plaquetas) || idade < 0 || alt < 0 || ast < 0 || plaquetas < 0) {
      erroEl.classList.remove("escondido");
      resultadoEl.classList.add("escondido");
      return;
    }

    erroEl.classList.add("escondido");

    // FIB-4
    const fib             = (idade * ast) / (plaquetas * Math.sqrt(alt));
    const fibArredondada  = Math.round(fib * 10) / 10;         
    const classificacao   = classificarFib(fibArredondada);

    valorEl.textContent         = `FIB-4: ${fibArredondada}`;
    tagEl.textContent           = classificacao.tag;
    interpretacaoEl.textContent = classificacao.texto;

    resultadoEl.className = "calc-resultado " + classificacao.classe;
    resultadoEl.classList.remove("escondido");
    resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  btnCalcular.addEventListener("click", calcularFib);

  [inputIdades, inputAst, inputAlt, inputPlaquetas].forEach(campo => {
    campo.addEventListener("keydown", e => {
      if (e.key === "Enter") calcularFib();
    });
  });
})();
</script>
