<!-- calculadoras/ldl/index.html -->

<div class="calc-ldl">
  <h2>Estimativa para Colesterol LDL (LDL-c)</h2>

  <p class="calc-resumo">
    Encontre o LDL-c segundo a fórmula de Friedewald e avalie a meta conforme o
    risco cardiovascular.
  </p>

  <!-- Colesterol Total -->
  <div class="calc-campo">
    <label>Colesterol Total &mdash; mg/dL</label>
    <input
      type="number"
      id="ldl-ct"
      inputmode="decimal"
      placeholder="Ex: 200"
      min="0"
    />
  </div>

  <!-- HDL-c -->
  <div class="calc-campo">
    <label>Colesterol HDL &mdash; mg/dL</label>
    <input
      type="number"
      id="ldl-hdl"
      inputmode="decimal"
      placeholder="Ex: 50"
      min="0"
    />
  </div>

  <!-- Triglicerídeos -->
  <div class="calc-campo">
    <label>Triglicerídeos &mdash; mg/dL</label>
    <input
      type="number"
      id="ldl-triglicerideos"
      inputmode="decimal"
      placeholder="Ex: 150"
      min="0"
    />
  </div>

  <button id="ldl-btn-calcular" class="calc-btn">Calcular</button>

  <div id="ldl-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="ldl-valor"></p>
    <p class="calc-resultado-tag" id="ldl-tag"></p>
    <p class="calc-resultado-interpretacao" id="ldl-interpretacao"></p>
  </div>

  <p id="ldl-erro" class="calc-erro escondido">
    Preencha todos os campos com valores numéricos válidos.
  </p>

  <div id="ldl-accordion-container"></div>
</div>

<style>
  .calc-ldl {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-ldl h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid transparent;
  }

  .calc-resultado-valor {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .calc-resultado-interpretacao {
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .calc-resultado.adequada {
    background-color: rgba(22, 163, 74, 0.08);
    border-color: #16a34a;
  }
  .calc-resultado.adequada .calc-resultado-valor,
  .calc-resultado.adequada .calc-resultado-tag {
    color: #16a34a;
  }

  .calc-resultado.risco-baixo {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-baixo .calc-resultado-valor,
  .calc-resultado.risco-baixo .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.atencao {
    background-color: rgba(217, 158, 10, 0.1);
    border-color: #d99e0a;
  }
  .calc-resultado.atencao .calc-resultado-valor,
  .calc-resultado.atencao .calc-resultado-tag {
    color: #a16207;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }
</style>

<script>
  (function () {
    const inputCt = document.getElementById("ldl-ct");
    const inputHdl = document.getElementById("ldl-hdl");
    const inputTriglicerideos = document.getElementById("ldl-triglicerideos");
    const btnCalcular = document.getElementById("ldl-btn-calcular");
    const resultadoEl = document.getElementById("ldl-resultado");
    const valorEl = document.getElementById("ldl-valor");
    const tagEl = document.getElementById("ldl-tag");
    const interpretacaoEl = document.getElementById("ldl-interpretacao");
    const erroEl = document.getElementById("ldl-erro");

    const container = document.getElementById("ldl-accordion-container");

    var refs = `
  <ol class="info-list">
    <li>Friedewald WT, Levy RI, Fredrickson DS. Estimation of the concentration of low-density lipoprotein cholesterol in plasma, without use of the preparative ultracentrifuge.
      <a href="https://doi.org/10.1093/clinchem/18.6.499" target="_blank">Clin Chem, 1972.</a>
    </li>
  </ol>`;

    var formula = `
  <p class="info-formula-label">Fórmula de Friedewald:</p>
  <div class="info-formula-block">
    \\( \\text{LDL} = \\text{Colesterol Total} - [\\text{HDL} + (\\dfrac{\\text{Triglicerídeos}}{5})] \\)
  </div>
  <p class="info-formula-nota">
    Sua validade isolada é limitada &mdash; Sempre utilize em conjunto com o quadro clínico e demais avaliações laboratoriais.
  </p>`;

    var cuidados = `
  <ul class="info-list">
    <li>Utilize calculadoras para estimar o risco cardiovascular e, posteriormente, sua meta de LDL-c.</li>
    <li>A presente fórmula pode tornar-se imprecisa ao apresentar valores elevados de Triglicerídeos, principalmente com valores superiores a 400 mg/dL.</li>
  </ul>`;

    container.innerHTML = montarAccordion(refs, formula, cuidados);
    iniciarAccordion();

    container.innerHTML = montarAccordion(refs, formula, cuidados);
    iniciarAccordion();
    renderMathInElement(container, {
      // linha nova
      delimiters: [{ left: "\\(", right: "\\)", display: false }],
    });

    function classificarLdl(ldl) {
      if (ldl < 40)
        return {
          classe: "atencao",
          tag: "Meta para Risco Cardiovascular Extremo",
          texto:
            "Correlacionar com dados clínicos-laboratoriais. Se discordância entre LDL-c e risco do paciente, avaliar necessidade de intervenção clínica conforme necessidade.",
        };
      if (ldl < 50)
        return {
          classe: "atencao",
          tag: "Meta para Risco Cardiovascular Muito Alto",
          texto:
            "Correlacionar com dados clínicos-laboratoriais. Se discordância entre LDL-c e risco do paciente, avaliar necessidade de intervenção clínica conforme necessidade.",
        };
      if (ldl < 70)
        return {
          classe: "atencao",
          tag: "Meta para Risco Cardiovascular Alto",
          texto:
            "Correlacionar com dados clínicos-laboratoriais. Se discordância entre LDL-c e risco do paciente, avaliar necessidade de intervenção clínica conforme necessidade.",
        };
      if (ldl < 100)
        return {
          classe: "atencao",
          tag: "Meta para Risco Cardiovascular Intermediário",
          texto:
            "Correlacionar com dados clínicos-laboratoriais. Se discordância entre LDL-c e risco do paciente, avaliar necessidade de intervenção clínica conforme necessidade.",
        };
      if (ldl < 115)
        return {
          classe: "atencao",
          tag: "Meta para Risco Cardiovascular Baixo",
          texto:
            "Correlacionar com dados clínicos-laboratoriais. Se discordância entre LDL-c e risco do paciente, avaliar necessidade de intervenção clínica conforme necessidade.",
        };
      return {
        classe: "risco-alto",
        tag: "Colesterol LDL acima de todas as metas",
        texto:
          "Correlacionar com dados clínicos-laboratoriais. Avaliar necessidade de intervenção clínica conforme necessidade.",
      };
    }

    function calcularLdl() {
      const ct = parseFloat(inputCt.value);
      const hdl = parseFloat(inputHdl.value);
      const triglicerideos = parseFloat(inputTriglicerideos.value);

      if (
        isNaN(ct) ||
        isNaN(hdl) ||
        isNaN(triglicerideos) ||
        ct < 0 ||
        hdl < 0 ||
        triglicerideos < 0
      ) {
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      erroEl.classList.add("escondido");

      // LDL-C em mg/dL
      const ldl = ct - (hdl + triglicerideos / 5);
      const ldlArredondada = Math.round(ldl * 10) / 10;

      // Validação: CT menor que HDL
      if (ct <= hdl) {
        erroEl.textContent =
          "O Colesterol Total deve ser maior que o HDL-c. Verifique os valores.";
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      // Validação: LDL negativo ou zero
      if (ldlArredondada <= 0) {
        erroEl.textContent =
          "Os valores informados resultam em LDL-c inválido. Verifique se os dados estão corretos.";
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      // Aviso trig > 400 (não impede o cálculo)
      const avisoTrig =
        triglicerideos > 400
          ? "⚠ Triglicerídeos > 400 mg/dL: a fórmula de Friedewald perde precisão nesse intervalo. Considere dosagem direta do LDL-c."
          : "";

      const classificacao = classificarLdl(ldlArredondada);

      valorEl.textContent = `LDL-c: ${ldlArredondada} mg/dL`;
      tagEl.textContent = classificacao.tag;
      interpretacaoEl.innerHTML =
        classificacao.texto +
        (avisoTrig
          ? `<br><br><span style="color:#d97706;font-size:0.85rem">${avisoTrig}</span>`
          : "");

      resultadoEl.className = "calc-resultado " + classificacao.classe;
      resultadoEl.classList.remove("escondido");
      resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    btnCalcular.addEventListener("click", calcularLdl);

    [inputCt, inputHdl, inputTriglicerideos].forEach((campo) => {
      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calcularLdl();
      });
    });
  })();
</script>
