<!-- calculadoras/rac/index.html -->

<div class="calc-rac">
  <h2>Relação Albumina-Creatinina (RAC)</h2>

  <!-- Albumina -->
  <div class="calc-campo">
    <label>Albumina Urinária</label>
    <div class="radio-group">
      <label><input type="radio" name="unidade-alb" value="mgl" checked> mg/L</label>
      <label><input type="radio" name="unidade-alb" value="mgdl"> mg/dL</label>
    </div>
    <input type="number" id="rac-albumina" inputmode="decimal" placeholder="Ex: 30" min="0">
  </div>

  <!-- Creatinina -->
  <div class="calc-campo">
    <label>Creatinina Urinária</label>
    <div class="radio-group">
      <label><input type="radio" name="unidade-creat" value="mgdl" checked> mg/dL</label>
      <label><input type="radio" name="unidade-creat" value="gl"> g/L</label>
    </div>
    <input type="number" id="rac-creatinina" inputmode="decimal" placeholder="Ex: 100" min="0">
  </div>

  <button id="rac-btn-calcular" class="calc-btn">Calcular</button>

  <div id="rac-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="rac-valor"></p>
    <p class="calc-resultado-tag" id="rac-tag"></p>
    <p class="calc-resultado-interpretacao" id="rac-interpretacao"></p>
  </div>

  <p id="rac-erro" class="calc-erro escondido">
    Preencha Albumina e Creatinina com valores numéricos válidos.
  </p>
</div>

<style>
  .calc-rac {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-rac h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .radio-group {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 8px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.85rem;
    font-weight: 400;
    color: #374151;
    cursor: pointer;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid transparent;
  }

  .calc-resultado-valor {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .calc-resultado-interpretacao {
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .calc-resultado.adequada {
    background-color: rgba(22, 163, 74, 0.08);
    border-color: #16a34a;
  }
  .calc-resultado.adequada .calc-resultado-valor,
  .calc-resultado.adequada .calc-resultado-tag { color: #16a34a; }

  .calc-resultado.atencao {
    background-color: rgba(217, 158, 10, 0.1);
    border-color: #d99e0a;
  }
  .calc-resultado.atencao .calc-resultado-valor,
  .calc-resultado.atencao .calc-resultado-tag { color: #a16207; }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag { color: #dc2626; }
</style>

<script>
(function () {
  const inputAlbumina   = document.getElementById("rac-albumina");
  const inputCreatinina = document.getElementById("rac-creatinina");
  const btnCalcular     = document.getElementById("rac-btn-calcular");
  const resultadoEl     = document.getElementById("rac-resultado");
  const valorEl         = document.getElementById("rac-valor");
  const tagEl           = document.getElementById("rac-tag");
  const interpretacaoEl = document.getElementById("rac-interpretacao");
  const erroEl          = document.getElementById("rac-erro");

  function classificarRAC(rac) {
    if (rac < 30) return {
      classe: "adequada",
      tag: "Normal (A1)",
      texto: "Albuminúria normal ou levemente aumentada. Monitorar conforme contexto clínico."
    };
    if (rac <= 300) return {
      classe: "atencao",
      tag: "Moderadamente aumentada (A2)",
      texto: "Microalbuminúria. Monitorar tendência e avaliar fatores de risco associados."
    };
    return {
      classe: "risco-alto",
      tag: "Severamente aumentada (A3)",
      texto: "Macroalbuminúria. Investigação e acompanhamento nefrológico indicados."
    };
  }

  function calcularRAC() {
    const alb  = parseFloat(inputAlbumina.value);
    const creat = parseFloat(inputCreatinina.value);

    if (isNaN(alb) || isNaN(creat) || alb < 0 || creat <= 0) {
      erroEl.classList.remove("escondido");
      resultadoEl.classList.add("escondido");
      return;
    }

    erroEl.classList.add("escondido");

    // Converte albumina para mg/L
    const unidadeAlb  = document.querySelector('input[name="unidade-alb"]:checked').value;
    const albMgl      = unidadeAlb === "mgdl" ? alb * 10 : alb;

    // Converte creatinina para g/L
    const unidadeCreat = document.querySelector('input[name="unidade-creat"]:checked').value;
    const creatGl      = unidadeCreat === "mgdl" ? creat / 100 : creat;

    // RAC em mg/g
    const rac             = albMgl / creatGl;
    const racArredondada  = Math.round(rac * 10) / 10;
    const classificacao   = classificarRAC(racArredondada);

    valorEl.textContent       = `RAC: ${racArredondada} mg/g`;
    tagEl.textContent         = classificacao.tag;
    interpretacaoEl.textContent = classificacao.texto;

    resultadoEl.className = "calc-resultado " + classificacao.classe;
    resultadoEl.classList.remove("escondido");
    resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  btnCalcular.addEventListener("click", calcularRAC);

  [inputAlbumina, inputCreatinina].forEach(campo => {
    campo.addEventListener("keydown", e => {
      if (e.key === "Enter") calcularRAC();
    });
  });
})();
</script>
