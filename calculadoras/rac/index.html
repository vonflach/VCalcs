<div class="calc-rac">
  <h2>Relação Albumina-Creatinina (RAC)</h2>
  <p class="calc-formula">RAC = Albumina Urinária / Creatinina Urinária</p>

  <div class="calc-campo">
    <label for="rac-albumina">Albumina Urinária &mdash; mg/L</label>
    <input type="number" id="rac-albumina" inputmode="decimal" placeholder="Ex: 10" min="0">
  </div>

  <div class="calc-campo">
    <label for="rac-creatinina">Creatinina Urinária &mdash; mg/dL</label>
    <input type="number" id="rac-creatinina" inputmode="decimal" placeholder="Ex: 100" min="0">
  </div>

  <button id="rac-btn-calcular" class="calc-btn">Calcular</button>

  <div id="rac-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor" id="rac-valor"></p>
    <p class="calc-resultado-tag" id="rac-tag"></p>
    <p class="calc-resultado-interpretacao" id="rac-interpretacao"></p>
  </div>

  <p id="rac-erro" class="calc-erro escondido">
    Preencha Albumina Urinária e Creatinina Urinária com valores numéricos válidos.
  </p>
</div>

<style>
  .calc-rac {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-rac h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .calc-campo input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .calc-campo input:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid transparent;
  }

  .calc-resultado-valor {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .calc-resultado-interpretacao {
    font-size: 0.9rem;
    line-height: 1.5;
  }

  /* Faixas de interpretação */
  .calc-resultado.atencao {
    background-color: rgba(217, 158, 10, 0.1);
    border-color: #d99e0a;
  }
  .calc-resultado.atencao .calc-resultado-valor,
  .calc-resultado.atencao .calc-resultado-tag {
    color: #a16207;
  }

  .calc-resultado.adequada {
    background-color: rgba(22, 163, 74, 0.08);
    border-color: #16a34a;
  }
  .calc-resultado.adequada .calc-resultado-valor,
  .calc-resultado.adequada .calc-resultado-tag {
    color: #16a34a;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }
</style>

<script>
  (function () {
    const inputAlbumina = document.getElementById("rac-albumina");
    const inputCreatinina = document.getElementById("rac-creatinina");
    const btnCalcular = document.getElementById("rac-btn-calcular");
    const resultadoEl = document.getElementById("rac-resultado");
    const valorEl = document.getElementById("rac-valor");
    const tagEl = document.getElementById("rac-tag");
    const interpretacaoEl = document.getElementById("rac-interpretacao");
    const erroEl = document.getElementById("rac-erro");

    function classificarRAC(rac) {
      if (rac < 30) {
        return {
          classe: "adequada",
          tag: "Adequada - RAC Normal",
          texto: "RAC normal ou discretamente elevada. Avaliar contexto clínico e monitorar conforme necessidade."
        };
      }
      if (rac < 300) {
        return {
          classe: "atencao",
          tag: "Atenção — RAC Elevada",
          texto: "RAC moderadamente elevada. Monitorar tendência e contexto clínico."
        };
      }
      return {
        classe: "risco-alto",
        tag: "Risco — RAC Muito Elevada",
        texto: "RAC severamente elevada. Avaliar necessidade de intervenção conforme contexto clínico."
      };
    }

    function calcularRAC() {
      const alb = parseFloat(inputAlbumina.value);
      const cre = parseFloat(inputCreatinina.value);

      const valido =
        !isNaN(alb) && !isNaN(cre) && alb >= 0 && cre >= 0;

      if (!valido) {
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      erroEl.classList.add("escondido");

      const rac = (alb / cre) * 1000; // Convertendo para mg/g
      const racArredondada = Math.round(rac * 10) / 10;
      const classificacao = classificarRAC(racArredondada);

      valorEl.textContent = `RAC: ${racArredondada} mg/g`;
      tagEl.textContent = classificacao.tag;
      interpretacaoEl.textContent = classificacao.texto;

      resultadoEl.className = "calc-resultado " + classificacao.classe;
      resultadoEl.classList.remove("escondido");
      resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    btnCalcular.addEventListener("click", calcularRAC);

    // Permite calcular pressionando Enter em qualquer um dos campos
    [inputAlbumina, inputCreatinina].forEach((campo) => {
      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calcularRAC();
      });
    });
  })();
</script>
