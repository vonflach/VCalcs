<!-- calculadoras/ret/index.html -->

<div class="calc-ret">
  <h2>Contagem de Reticulócitos Corrigida</h2>

  <p class="calc-resumo">
    Corrige os valores de reticulócitos conforme o grau da anemia do paciente.
  </p> 

  <!-- Componente do Hemograma -->
  <div class="calc-campo">
    <label>Parâmetro analisado no Hemograma</label>
    <div class="radio-group">
      <label><input type="radio" name="hemograma" value="ht" checked> <span>Hematócrito (%)</span></label>
      <label><input type="radio" name="hemograma" value="hb"> <span>Hemoglobina (g/dL)</span></label>
    </div>
    <input type="number" id="ret-hemograma" inputmode="decimal" placeholder="Ex: 45" min="0">
  </div>

  <!-- Reticulócitos -->
  <div class="calc-campo">
    <label>Reticulócitos (%)</label>
    <input type="number" id="ret-valor1" inputmode="decimal" placeholder="Ex: 3" min="0">
  </div>
  
  <button id="ret-btn-calcular" class="calc-btn">Calcular</button>

  <div id="ret-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="ret-valor"></p>
    <p class="calc-resultado-tag" id="ret-tag"></p>
    <p class="calc-resultado-interpretacao" id="ret-interpretacao"></p>
  </div>

  <p id="ret-erro" class="calc-erro escondido">
    Preencha todos os campos com valores numéricos válidos.
  </p>
</div>

<style>
  .calc-ret {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-ret h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .radio-group {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 8px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.85rem;
    font-weight: 400;
    color: #374151;
    cursor: pointer;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid var(--cor-cyan);
    background-color: rgba(14, 116, 144, 0.06);
  }

  .calc-resultado-tag {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--cor-cyan);
  margin-bottom: 4px;
  }

.calc-resultado-valor {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--cor-cyan);
  margin: 0 0 8px;
  white-space: pre-line;
  }

.calc-resultado-interpretacao {
  font-size: 0.88rem;
  color: var(--cor-texto-secundario);
  line-height: 1.5;
  margin: 0;
  }
</style>

<script>
(function () {
  const inputHemograma  = document.getElementById("ret-hemograma");
  const inputValor      = document.getElementById("ret-valor1");
  const btnCalcular     = document.getElementById("ret-btn-calcular");
  const resultadoEl     = document.getElementById("ret-resultado");
  const valorEl         = document.getElementById("ret-valor");
  const tagEl           = document.getElementById("ret-tag");
  const interpretacaoEl = document.getElementById("ret-interpretacao");
  const erroEl          = document.getElementById("ret-erro");

// Chama na inicialização para já mostrar a correta  
  function calcularRet() {
    const hemo  = parseFloat(inputHemograma.value);
    const valor = parseFloat(inputValor.value);

    if (isNaN(hemo) || isNaN(valor) || hemo < 0 || valor < 0) {
      erroEl.classList.remove("escondido");
      resultadoEl.classList.add("escondido");
      return;
    }

    erroEl.classList.add("escondido");

    // Conversão do hemograma, se necessário
    const hemogramaHt  = document.querySelector('input[name="hemograma"]:checked').value;
    const hemogramaHb = hemogramaHt === "ht" ? hemo / 45 : hemo / 15;;

    // Reticulócitos corrigidos %
    const ret             = hemogramaHb * valor;
    const retArredondada  = Math.round(ret * 10) / 10;

    valorEl.textContent       = `${retArredondada} %`;
    tagEl.textContent         = "Reticulócitos Corrigidos";
    interpretacaoEl.textContent = "Avaliar o resultado em conjunto com demais parâmetros clínicos e laboratoriais do paciente.";

    resultadoEl.className = "calc-resultado ";
    resultadoEl.classList.remove("escondido");
    resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  btnCalcular.addEventListener("click", calcularRet);

  [inputHemograma, inputValor].forEach(campo => {
    campo.addEventListener("keydown", e => {
      if (e.key === "Enter") calcularRet();
    });
  });
})();
</script>
