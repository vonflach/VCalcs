<!-- calculadoras/sodio-glicose/index.html -->

<div class="calc-sodio-glicose">
  <h2>Sódio Corrigido pela Hiperglicemia</h2>

  <p class="calc-resumo">
    Corrija os níveis séricos de sódio pela hiperglicemia.
  </p>

  <!-- Sódio -->
  <div class="calc-campo">
    <label>Sódio Sérico &mdash; mEq/L</label>
    <input
      type="number"
      id="sg-sodio"
      inputmode="decimal"
      placeholder="Ex: 140"
      min="0"
    />
  </div>

  <!-- Glicose -->
  <div class="calc-campo">
    <label>Glicose Sérica &mdash; mg/dL</label>
    <input
      type="number"
      id="sg-glicose"
      inputmode="decimal"
      placeholder="Ex: 90"
      min="0"
    />
  </div>

  <button id="sg-btn-calcular" class="calc-btn">Calcular</button>

  <div id="sg-resultado" class="calc-resultado escondido">
    <p class="calc-resultado-valor resultado-valor" id="sg-valor"></p>
    <p class="calc-resultado-tag" id="sg-tag"></p>
    <p class="calc-resultado-interpretacao" id="sg-interpretacao"></p>
  </div>

  <p id="sg-erro" class="calc-erro escondido">
    Preencha Sódio e Glicose com valores numéricos válidos.
  </p>
</div>

<style>
  .calc-sodio-glicose {
    max-width: 480px;
    margin: 0 auto;
  }

  .calc-sodio-glicose h2 {
    color: var(--cor-grafite);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  .calc-formula {
    color: var(--cor-texto-secundario);
    font-size: 0.9rem;
    margin-bottom: 24px;
    font-style: italic;
  }

  .calc-campo {
    margin-bottom: 18px;
  }

  .calc-campo label {
    display: block;
    font-size: 0.88rem;
    color: var(--cor-texto);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .calc-campo input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d0d5db;
    border-radius: 8px;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .calc-campo input[type="number"]:focus {
    outline: none;
    border-color: var(--cor-cyan);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--cor-cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .calc-btn:hover {
    background-color: var(--cor-grafite);
  }

  .calc-erro {
    color: #b42318;
    font-size: 0.88rem;
    margin-top: 12px;
    text-align: center;
  }

  .calc-resultado {
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid transparent;
  }

  .calc-resultado-valor {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .calc-resultado-tag {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .calc-resultado-interpretacao {
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .calc-resultado.adequada {
    background-color: rgba(22, 163, 74, 0.08);
    border-color: #16a34a;
  }
  .calc-resultado.adequada .calc-resultado-valor,
  .calc-resultado.adequada .calc-resultado-tag {
    color: #16a34a;
  }

  .calc-resultado.risco-baixo {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-baixo .calc-resultado-valor,
  .calc-resultado.risco-baixo .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }

  .calc-resultado.risco-alto {
    background-color: rgba(220, 38, 38, 0.08);
    border-color: #dc2626;
  }
  .calc-resultado.risco-alto .calc-resultado-valor,
  .calc-resultado.risco-alto .calc-resultado-tag {
    color: #dc2626;
  }
</style>

<script>
  (function () {
    const inputSodio = document.getElementById("sg-sodio");
    const inputGlicose = document.getElementById("sg-glicose");
    const btnCalcular = document.getElementById("sg-btn-calcular");
    const resultadoEl = document.getElementById("sg-resultado");
    const valorEl = document.getElementById("sg-valor");
    const tagEl = document.getElementById("sg-tag");
    const interpretacaoEl = document.getElementById("sg-interpretacao");
    const erroEl = document.getElementById("sg-erro");

    function classificarSg(sg) {
      if (sg < 135)
        return {
          classe: "risco-baixo",
          tag: "Sódio corrigido baixa",
          texto:
            "Avaliar sinais de hipervolemia e possíveis etiologias. Revisar valores inseridos e contexto clínico.",
        };
      if (sg <= 145)
        return {
          classe: "adequada",
          tag: "Sódio corrigido dentro da normalidade",
          texto:
            "Acompanhar balanço hídrico e demais eletrólitos. Revisar contexto clínico.",
        };
      return {
        classe: "risco-alto",
        tag: "Sódio corrigido elevado",
        texto:
          "Avaliar sinais de desidratação e possíveis etiologias. Revisar valores inseridos e contexto clínico.",
      };
    }

    function calcularSg() {
      const sodio = parseFloat(inputSodio.value);
      const glicose = parseFloat(inputGlicose.value);

      if (isNaN(sodio) || isNaN(glicose) || sodio < 0 || glicose < 0) {
        erroEl.classList.remove("escondido");
        resultadoEl.classList.add("escondido");
        return;
      }

      erroEl.classList.add("escondido");

      // Sódio corrigido em mEq/L
      const sg = sodio + 0.024 * (glicose - 100);
      const sgArredondada = Math.round(sg * 10) / 10;
      const classificacao = classificarSg(sgArredondada);

      valorEl.textContent = `Sódio Corrigido: ${sgArredondada} mEq/L`;
      tagEl.textContent = classificacao.tag;
      interpretacaoEl.textContent = classificacao.texto;

      resultadoEl.className = "calc-resultado " + classificacao.classe;
      resultadoEl.classList.remove("escondido");
      resultadoEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    btnCalcular.addEventListener("click", calcularSg);

    [inputSodio, inputGlicose].forEach((campo) => {
      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calcularSg();
      });
    });
  })();
</script>
