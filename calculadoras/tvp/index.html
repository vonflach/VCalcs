<!-- calculadoras/tvp/index.html -->

<div class="calc-tvp">
  <h2>Critérios de Wells para Trombose Venosa Profunda (TVP)</h2>

  <p class="calc-resumo">
    Estima o risco de TVP com base em critérios clínicos.
  </p>
  
  <!-- CA ativo -->
  <div class="calc-campo">
    <label>Câncer em curso</label>
    <div class="radio-group">
      <label><input type="radio" name="cancer" value="sim"> <span>Sim</span></label>
      <label><input type="radio" name="cancer" value="nao" checked> <span>Não</span></label>
    </div>
  </div>

  <button id="tvp-btn-calcular" class="calc-btn">Calcular</button>
